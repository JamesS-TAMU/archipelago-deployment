# Run `docker-compose up` -d or `docker compose up -d` if on MacOS
# If running Linux, make sure /persistent/iiifcache has 8183:8183 ownership
# If running Linux, make sure /persistent/solrcore has 8983:8983 ownership
# enabling :cache for the volumens can bypass that need.
# on OSX brew install minio/stable/mc for the minio client
services:
  web:
    image: nginx
    ports:
      - 8001:80
    volumes:
      - archipelago-nfs-location/nginxconfigford8/default.conf:/etc/nginx/conf.d/default.conf
      - archipelago-nfs-location:/var/www/html
  php:
    image: "esmero/php-8.3-fpm:1.5.0-multiarch"
    environment:
      MYSQL_HOSTNAME: "mysql-db-host"
      MYSQL_PORT: 3306
      MYSQL_DATABASE: "archipelago"
      MYSQL_USER: "archipelago"
      MYSQL_PASSWORD: "archipelago"
    volumes:
      - archipelago-nfs-location:/var/www/html
  solr:
    image: solr:9.10.0
    environment:
      SOLR_HEAP: 512m
      SOLR_OPTS: -Dsolr.jetty.request.header.size=65535 -Dsolr.install.dir=/opt/solr
      SOLR_MODULES: "extraction,langid,ltr,analysis-extras,scripting"
    ports:
      - 8983:8983
    volumes:
      archipelago-solr-pv/data:/var/solr/data
      archipelago-pv/persistent/solrconfig:/drupalconfig
    entrypoint:
      - solr-precreate
      - drupal
      - /drupalconfig
  nlp:
    image: esmero/esmero-nlp:1.4.2-fasttext-multiarch
    ports:
      - 6400:6400
  iiif:
    image: esmero/cantaloupe-s3:6.0.5-noturbojpeg-multiarch
    environment:
      XMX: 2g
      XMS: 256m
      JAVA_OPS: -XX:+UseG1GC
    ports:
      - 8183:8182
    volumes:
      - archipelago-nfs-location/persistent/iiifconfig:/etc/cantaloupe
      - archipelago-nfs-location/persistent/iiifcache:/var/cache/cantaloupe
  minio:
    image: minio/minio:latest
    volumes:
         - archipelago-nfs-location/persistent/miniodata:/data:cached
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"

